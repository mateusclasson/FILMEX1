<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FILMEX - Filmes e Séries</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ==================================================
         HEADER
    ================================================== -->

    <header class="header">

        <a href="#inicio" class="logo">
            FILME<span>X</span>
        </a>

        <nav class="menu">

            <a href="#inicio">
                Início
            </a>

            <a href="#filmes">
                Filmes
            </a>

            <a href="#populares">
                Populares
            </a>

            <div class="dropdown">

                <button
                    class="btn btn-dark dropdown-toggle"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false">

                    Categorias

                </button>

                <ul class="dropdown-menu">

                    <li>
                        <a
                            class="dropdown-item"
                            href="#"
                            onclick="loadCategory(28, 'Ação'); return false;">
                            Ação
                        </a>
                    </li>

                    <li>
                        <a
                            class="dropdown-item"
                            href="#"
                            onclick="loadCategory(35, 'Comédia'); return false;">
                            Comédia
                        </a>
                    </li>

                    <li>
                        <a
                            class="dropdown-item"
                            href="#"
                            onclick="loadCategory(27, 'Terror'); return false;">
                            Terror
                        </a>
                    </li>

                    <li>
                        <a
                            class="dropdown-item"
                            href="#"
                            onclick="loadCategory(10749, 'Romance'); return false;">
                            Romance
                        </a>
                    </li>

                    <li>
                        <a
                            class="dropdown-item"
                            href="#"
                            onclick="loadCategory(878, 'Ficção Científica'); return false;">
                            Ficção Científica
                        </a>
                    </li>

                    <li>
                        <a
                            class="dropdown-item"
                            href="#"
                            onclick="loadCategory(14, 'Fantasia'); return false;">
                            Fantasia
                        </a>
                    </li>

                    <li>
                        <a
                            class="dropdown-item"
                            href="#"
                            onclick="loadCategory(53, 'Thriller'); return false;">
                            Thriller
                        </a>
                    </li>

                    <li>
                        <a
                            class="dropdown-item"
                            href="#"
                            onclick="loadCategory(18, 'Drama'); return false;">
                            Drama
                        </a>
                    </li>

                    <li>
                        <a
                            class="dropdown-item"
                            href="#"
                            onclick="loadCategory(9648, 'Mistério'); return false;">
                            Mistério
                        </a>
                    </li>

                    <li>
                        <a
                            class="dropdown-item"
                            href="#"
                            onclick="loadCategory(16, 'Animação'); return false;">
                            Animação
                        </a>
                    </li>

                </ul>

            </div>

        </nav>

        <!-- PESQUISA -->

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Pesquisar filmes..."
                autocomplete="off"
            >

            <button
                id="searchButton"
                type="button">

                🔍

            </button>

        </div>

        <!-- PERFIL -->

        <button
            class="profile-button"
            type="button">

            👤

        </button>

    </header>


    <!-- ==================================================
         CONTEÚDO
    ================================================== -->

    <main id="inicio">

        <!-- CAROUSEL -->

        <section class="hero-section">

            <div
                id="filmexCarousel"
                class="carousel slide"
                data-bs-ride="carousel">

                <div
                    id="carouselIndicators"
                    class="carousel-indicators">
                </div>

                <div
                    id="carouselInner"
                    class="carousel-inner">
                </div>

                <button
                    class="carousel-control-prev"
                    type="button"
                    data-bs-target="#filmexCarousel"
                    data-bs-slide="prev">

                    <span
                        class="carousel-control-prev-icon">
                    </span>

                    <span class="visually-hidden">
                        Anterior
                    </span>

                </button>

                <button
                    class="carousel-control-next"
                    type="button"
                    data-bs-target="#filmexCarousel"
                    data-bs-slide="next">

                    <span
                        class="carousel-control-next-icon">
                    </span>

                    <span class="visually-hidden">
                        Próximo
                    </span>

                </button>

            </div>

        </section>


        <!-- DESTAQUES -->

        <section
            id="filmes"
            class="movie-section">

            <div class="container-fluid">

                <h2 class="section-title">
                    Filmes em Destaque
                </h2>

                <div
                    id="featuredMovies"
                    class="movie-grid">
                </div>

            </div>

        </section>


        <!-- POPULARES -->

        <section
            id="populares"
            class="movie-section">

            <div class="container-fluid">

                <h2 class="section-title">
                    Filmes Populares
                </h2>

                <div
                    id="popularMovies"
                    class="movie-grid">
                </div>

                <div
                    id="popularPagination"
                    class="pagination-container">
                </div>

            </div>

        </section>


        <!-- CATEGORIA -->

        <section
            id="categorySection"
            class="movie-section"
            style="display: none;">

            <div class="container-fluid">

                <h2
                    id="categoryTitle"
                    class="section-title">
                </h2>

                <div
                    id="categoryMovies"
                    class="movie-grid">
                </div>

                <div
                    id="categoryPagination"
                    class="pagination-container">
                </div>

            </div>

        </section>


        <!-- PESQUISA -->

        <section
            id="searchResultsSection"
            class="movie-section"
            style="display: none;">

            <div class="container-fluid">

                <h2
                    id="searchTitle"
                    class="section-title">
                </h2>

                <div
                    id="searchResults"
                    class="movie-grid">
                </div>

                <div
                    id="searchPagination"
                    class="pagination-container">
                </div>

            </div>

        </section>

    </main>


    <!-- ==================================================
         MODAL DOS DETALHES DO FILME
    ================================================== -->

    <div
        id="movieModal"
        class="movie-modal">

        <div class="movie-modal-content">

            <button
                id="closeModal"
                class="close-modal"
                type="button">

                ×

            </button>

            <div id="movieDetails">
            </div>

        </div>

    </div>


    <!-- ==================================================
         MODAL DO TRAILER
    ================================================== -->

    <div
        id="trailerModal"
        class="trailer-modal">

        <div class="trailer-modal-content">

            <button
                id="closeTrailer"
                class="close-trailer"
                type="button">

                ×

            </button>

            <h2>
                Trailer
            </h2>

            <div class="trailer-video">

                <iframe
                    id="trailerPlayer"
                    src=""
                    title="Trailer do filme"
                    frameborder="0"
                    allow="autoplay; encrypted-media; picture-in-picture"
                    allowfullscreen>
                </iframe>

            </div>

        </div>

    </div>


    <!-- ==================================================
         FOOTER
    ================================================== -->

    <footer class="footer">

        <p>
            © 2026 FILMEX - Filmes e Séries
        </p>

        <p>
            Dados e imagens fornecidos por TMDB.
        </p>

    </footer>


    <!-- Bootstrap -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
